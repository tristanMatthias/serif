name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, not just the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        serif favors great defaults over configuration. If you're proposing a
        new flag, please say why a better default couldn't serve everyone
        instead.
